[package]
name = "flowrs-build"
version = "0.1.0"
edition = "2021"
authors = ["wuermseer.florian@gmail.com", "markus.friedrich@hm.edu"]
description = "Build tools for the flowrs library."
repository = "https://github.com/flow-rs/flowrs-build"
license-file = "LICENSE"
readme = "README.md"
documentation = "https://docs.rs/flowrs-wasm"
keywords = ["flow", "fbp", "wasm"]
categories = ["data-structures", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
debug = true

[[bin]]
name = "service_main"
path = "src/bin/service_main.rs"

[[bin]]
name = "runner_main"
path = "src/bin/runner_main.rs"

# ────── Shared dependencies ──────

[dependencies]
anyhow = "1.0.83"
serde = { version = "1.0.201", features = ["derive"] }
serde_json = "1.0.117"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio-util = { version = "0.7.11", features = ["io"] }
mime_guess = "2.0.4"
handlebars = "5.1.2"
libloading = "0.8.3"
clap = { version = "4.5.4", features = ["derive"] }
ctrlc = "3.4.4"
dotenv = "0.15.0"
chrono = { version = "0.4", features = ["serde"] }
paste = "1.0"
quote = "1.0"
proc-macro2 = "1.0"
syn = "2.0.61"
wasm-bindgen = "0.2"

# ────── flowrs ──────
flowrs = { git = "https://github.com/flow-rs/flowrs", branch = "mtMophima-exec", default-features = false }
flowrs-std = { git = "https://github.com/flow-rs/flowrs-std", branch = "mtMophima-dev" }
flowrs-package = { git = "https://github.com/flow-rs/flowrs-package", branch = "main" }

# ────── Native-only dependencies ──────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5.2", features = ["cors"] }
tokio = { version = "1.37.0", features = ["full"] }
flowrs = { git = "https://github.com/flow-rs/flowrs", branch = "mtMophima-exec", features = ["tracing", "metrics"] }

# ────── WASM-safe tokio and getrandom ──────
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.37.0", features = ["rt", "macros", "time", "sync"] }
getrandom = { version = "0.2", features = ["js"] }

# ────── Dev & build dependencies ──────
[dev-dependencies]
tokio-test = "0.4.4"

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
cargo_metadata = "0.18.1"
toml = "0.5"
syn = { version = "2.0.61", features = ["full"] }
proc-macro2 = "1.0"
serde = { version = "1.0.201", features = ["derive"] }
serde_json = "1.0.117"
flowrs-package = { git = "https://github.com/flow-rs/flowrs-package", branch = "main" }
flowrs-std = { git = "https://github.com/flow-rs/flowrs-std", branch = "mtMophima-dev" }
flowrs = { git = "https://github.com/flow-rs/flowrs", branch = "mtMophima-exec" }