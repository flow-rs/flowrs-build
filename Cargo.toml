[package]
name = "flowrs-build"
version = "0.1.0"
edition = "2021"
authors = ["wuermseer.florian@gmail.com", "markus.friedrich@hm.edu"]
description = "Build tools for the flowrs library."
repository = "https://github.com/flow-rs/flowrs-build"
license-file = "LICENSE"
readme = "README.md"
documentation = "https://docs.rs/flowrs-wasm"
keywords = ["flow", "fbp", "wasm"]
categories = ["data-structures", "wasm"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
# [lib]
# crate-type = ["cdylib", "rlib"]

[[bin]]
name = "service_main"
path = "src/bin/service_main.rs"

[dependencies]
axum = "0.7.5"
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0.201", features = ["derive"] }
serde_json = "1.0.117"
tower = "0.4"
tower-http = { version = "0.5.2", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3.18"
paste = "1.0"

quote = "1.0"
proc-macro2 = "1.0"
syn = "2.0.61"
flowrs = { git = "https://github.com/flow-rs/flowrs", branch = "mtMophima-exec"}
flowrs-package = {git = "https://github.com/flow-rs/flowrs-package", branch = "main"}

#this is temporary
flowrs-std = { git = "https://github.com/flow-rs/flowrs-std", branch = "mtMophima-dev" }

anyhow = "1.0.83"
tokio-util = {version = "0.7.11", features = ["io"] }
mime_guess = "2.0.4"
handlebars = "5.1.2"
libloading = "0.8.3"
clap = { version = "4.5.4", features = ["derive"] }
ctrlc = "3.4.4"
dotenv = "0.15.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
#wasm-bindgen-test = "0.3.37"
tokio-test = "0.4.4"

[build-dependencies]
cargo_metadata = "0.18.1"
syn = "2.0.61"
proc-macro2 = "1.0"
toml = "0.5"
serde = { version = "1.0.201", features = ["derive"] }
serde_json = "1.0.117"
flowrs-package = {git = "https://github.com/flow-rs/flowrs-package", branch = "main"}

# Add dependencies containing flow-nodes here. The dependency will be imported
# as a flow-package if it contains the keyword "flow-package"
flowrs-std = {git = "https://github.com/flow-rs/flowrs-std", branch = "mtMophima-dev"}
